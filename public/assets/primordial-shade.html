    (() => {

      element('ellipse',{cx:770,cy:880,rx:410,ry:330,fill:'url(#crimson-haze)'},sky);
      let seed=31415;
      const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
      for(let i=0;i<145;i++) {

        gaze.style.setProperty('--travel-neg',`${i===2?-7:-12}px`);

          const angle=k*20,rad=angle*Math.PI/180;
          const anchor=element('g',{transform:`translate(${r*Math.sin(rad)} ${-r*Math.cos(rad)}) rotate(${angle})`},sphereFlames);

        }
        const defs=root.querySelector('defs');
        const sphereClip=element('clipPath',{id:`sphere-clip-${i}`,clipPathUnits:'userSpaceOnUse'},defs);

        element('circle',{cx:0,cy:0,r,fill:'url(#corrupted-crimson)',opacity:'.52'},sphereSurface);
        element('circle',{cx:0,cy:0,r,fill:'#ff0000',filter:'url(#crimson-living-surface)',opacity:'.7'},sphereSurface);
        const tileReveal=element('g',{'mask':`url(#sphere-reveal-${i})`},sphereSurface);
        const tileSurface=element('g',{class:'sphere-tiles'},tileReveal);
        for(let col=-4;col<=4;col++)for(let row=-4;row<=4;row++) {
          const cx=col*7.8,cy=(row+(Math.abs(col)%2)*.5)*9;
          const project=(x,y)=>{const distance=Math.hypot(x,y);const factor=distance?Math.sin(Math.min(distance/32,1.5))/(distance/32):1;return [x*factor,y*factor];};
          const pts=Array.from({length:6},(_,k)=>project(cx+5*Math.cos(k*Math.PI/3),cy+5*Math.sin(k*Math.PI/3)));

      });
      for(let i=0;i<18;i++) {

        [158,687,13,22],[205,699,8,9],[228,727,23,23],[253,746,8,8],
        [275,758,18,19,1],[251,778,13,14],[426,782,10,10],[400,810,16,16],

      particles.forEach(([x,y,w,h,red], i) => {

        const particle = element('g', {class:'motion'}, holder);
        const vx=x-543, vy=y-685, length=Math.hypot(vx,vy)||1;
        const distance=central ? 14 : 40+(i%5)*6;
        particle.style.setProperty('--dx', `${(vx/length*distance).toFixed(2)}px`);
        particle.style.setProperty('--dy', `${(vy/length*distance-6).toFixed(2)}px`);

        const hotAir=element('g',{filter:'url(#block-heat)'},particle);
        element('ellipse',{cx:0,cy:-h*.65,rx:w*2.3+8,ry:h*3+12,fill:'url(#block-hot-air)'},hotAir);

          element('rect',{x:-w*.7,y:-h*.22,width:w*1.4,height:2,fill:'#c63827',filter:'url(#eye-red-light)'},shards);

        'M 544 423 C 500 468 474 528 544 601 C 614 528 588 468 544 423 Z',
        'M 262 686 Q 350 605 430 686 Q 350 767 262 686 Z',
        'M 481 686 Q 544 642 607 686 Q 544 730 481 686 Z',
        'M 657 686 Q 735 605 821 686 Q 735 767 657 686 Z',
        'M 544 778 C 478 831 487 893 544 951 C 601 893 610 831 544 778 Z'
      ].forEach(d=>element('path',{d,fill:'url(#living-crimson-fill)',stroke:'#ff0909','stroke-width':5,filter:'url(#eye-interior-bloom)'},eyeInteriors));
      const dreadBackground=element('g',{},svg);
      svg.insertBefore(dreadBackground,emblem);
      const dreadHalos=element('g',{class:'dread-glow'},dreadBackground);
      [[544,521],[351,686],[544,686],[735,686],[544,861]].forEach(([cx,cy])=>element('ellipse',{cx,cy,rx:74,ry:66,fill:'url(#dread-pupil-halo)'},dreadHalos));
      [artwork,root.querySelector('#eye-pupils'),moving,root.querySelector('#eye-glitches')].forEach(node=>emblem.appendChild(node));
      artwork.setAttribute('id','crt-eye-source');
      const shineMask=element('mask',{id:'outline-shine-mask',maskUnits:'userSpaceOnUse',x:50,y:180,width:986,height:980,style:'mask-type:alpha'},root.querySelector('defs'));
      element('use',{href:'#crt-eye-source'},shineMask);
      const aura=element('g',{filter:'url(#outline-rainbow-soft)',class:'rainbow-emission'},emblem);
      element('rect',{x:170,y:350,width:750,height:650,fill:'url(#outline-rainbow)','mask':'url(#outline-shine-mask)'},aura);
      emblem.insertBefore(aura,artwork);
      const emission=element('g',{class:'emission-shimmer',filter:'url(#outline-rainbow-soft)'},emblem);
      element('use',{href:'#crt-eye-source'},emission);
      emblem.insertBefore(emission,artwork);
      const crt=element('g',{'aria-hidden':'true'},svg);
      element('use',{href:'#crt-eye-source',transform:'translate(-12 0)',filter:'url(#crt-red)',class:'crt-ghost'},crt);
      element('use',{href:'#crt-eye-source',transform:'translate(12 0)',filter:'url(#crt-blue)',class:'crt-ghost'},crt);
      const defs=root.querySelector('defs');
      [[405,34],[505,19],[654,26],[696,15],[848,23],[940,18]].forEach(([y,h],i)=>{
        const clip=element('clipPath',{id:`crt-slice-${i}`,clipPathUnits:'userSpaceOnUse'},defs);
        element('rect',{x:70,y,width:960,height:h},clip);
        const torn=element('g',{class:'crt-tear'},crt);
        const slice=element('g',{'clip-path':`url(#crt-slice-${i})`},torn);
        element('use',{href:'#crt-eye-source'},slice);
      });
      const heatScene=element('g',{filter:'url(#heat-air-refraction)'},svg);
      Array.from(svg.children).filter(node=>!['defs','title','desc'].includes(node.tagName.toLowerCase()) && node!==heatScene).forEach(node=>heatScene.appendChild(node));
      const airNoise=root.querySelector('#heat-air-noise');
      const airDisplace=root.querySelector('#heat-air-displace');
      const blockHeatNoise=root.querySelector('#block-heat-noise');
      const crimsonSurfaceNoise=root.querySelector('#crimson-surface-noise');
      const pupilNoise=root.querySelector('#pupil-heat-noise');
      const pupilDisplace=root.querySelector('#pupil-heat-displace');
      let lastHeatFrame=-100;
      let paused=true; let animationFrame=0; let lastTick=null, elapsed=0;
      function sync() {
        root.dataset.paused=String(paused);
        button.textContent=paused?'Play':'Pause';
        button.setAttribute('aria-label',`${paused?'Play':'Pause'} all animation`);
        if(paused){cancelAnimationFrame(animationFrame);animationFrame=0;lastTick=null;}else if(!animationFrame){animationFrame=requestAnimationFrame(watchfulTick);}
      }
      button.addEventListener('click',()=>{paused=!paused;sync();});
      sync();
      function watchfulTick(now) {
        animationFrame=0; if(paused)return;
        if(!root.isConnected)return;
        if(lastTick!==null && !paused)elapsed+=Math.min(now-lastTick,100);
        lastTick=now;
        if(!paused && elapsed-lastHeatFrame>90){
          lastHeatFrame=elapsed;
          const t=elapsed/1000;
          blockHeatNoise.setAttribute('baseFrequency',`${.065+Math.sin(t*1.8)*.012} ${.12+Math.cos(t*2.4)*.022}`);
          crimsonSurfaceNoise.setAttribute('baseFrequency',`${.075+Math.sin(t*.65)*.012} ${.11+Math.cos(t*.85)*.018}`);
          airNoise.setAttribute('baseFrequency',`${.012+Math.sin(t*.73)*.002} ${.045+Math.sin(t*1.13)*.006}`);
          airDisplace.setAttribute('scale',String(6.5+Math.sin(t*2.1)*1.5));
          pupilNoise.setAttribute('baseFrequency',`${.065+Math.sin(t*1.6)*.009} ${.11+Math.sin(t*2.3)*.015}`);
          pupilDisplace.setAttribute('scale',String(4.3+Math.sin(t*3.1)*1.2));
        }
        const phase=elapsed%29000;
        root.dataset.still=String(phase>=23200 && phase<24650);
        animationFrame=requestAnimationFrame(watchfulTick);
      }
      window.addEventListener('message',event=>{
        if(event.source!==parent || event.data?.type!=='signal-lab:scene')return;
        paused=event.data.paused!==false;
        const eyes=['crown','dusk','heart','dawn','root'];
        const holders=document.querySelector('#eye-pupils')?.children||[];
        eyes.forEach((id,index)=>{
          const holder=holders[index];if(!holder)return;
          const sealed=event.data.eyes?.[id]===true;
          const hue=Number.isFinite(event.data.hue)?Math.max(0,Math.min(360,event.data.hue)):0;
          holder.style.filter=sealed?'hue-rotate('+(145-hue)+'deg) saturate(.7) drop-shadow(0 0 8px #70e6bf)':'';
          holder.style.opacity=event.data.focus===id||sealed?'1':'.55';
          holder.dataset.sealed=String(sealed);
        });
        sync();
      });
      document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true;sync();}});
    })();
  </script>
</div>
</body></html>
